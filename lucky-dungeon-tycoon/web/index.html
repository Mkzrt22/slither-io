<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lucky Dungeon Tycoon</title>
  <style>
    :root {
      --bg: #14101f;
      --panel: #221a35;
      --panel-edge: #3b2d5c;
      --gold: #f6c244;
      --gem: #5fd4f5;
      --text: #efe9ff;
      --muted: #9b8fc0;
      --success: #6fe08a;
      --warning: #f0a84b;
      --error: #f06d6d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(circle at 50% 0%, #241b3d 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      text-align: center;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(246, 194, 68, 0.35);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }
    .stat .label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; }
    .stat .value { font-size: 0.95rem; font-weight: 700; margin-top: 2px; display: block; }
    #stat-gold { color: var(--gold); }
    #stat-gems { color: var(--gem); }
    #reel {
      background: var(--panel);
      border: 2px solid var(--panel-edge);
      border-radius: 16px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
    }
    .reel-pop { animation: pop 0.45s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0.2; }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #1c142e;
      background: var(--gold);
      cursor: pointer;
      transition: filter 0.15s, transform 0.05s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { filter: grayscale(0.8) brightness(0.6); cursor: not-allowed; }
    #btn-spin { font-size: 1.25rem; padding: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row button { background: var(--panel); color: var(--text); border: 1px solid var(--panel-edge); }
    #btn-upgrade { background: #4a3a7a; color: var(--text); }
    #log {
      list-style: none;
      font-size: 0.8rem;
      min-height: 120px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-info { color: var(--muted); }
    .log-success { color: var(--success); }
    .log-warning { color: var(--warning); }
    .log-error { color: var(--error); }
    #energy-popup {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 20, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #energy-popup.visible { display: flex; }
    .popup-card {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .popup-card h2 { font-size: 1.1rem; color: var(--gold); }
    .popup-card p { font-size: 0.85rem; color: var(--muted); }
    #btn-popup-close { background: transparent; color: var(--muted); padding: 6px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>⚒ LUCKY DUNGEON TYCOON ⚒</h1>

    <section class="stats" aria-label="Player resources">
      <div class="stat"><span class="label">Gold</span><span class="value" id="stat-gold">0</span></div>
      <div class="stat"><span class="label">Gems</span><span class="value" id="stat-gems">0</span></div>
      <div class="stat"><span class="label">Energy</span><span class="value" id="stat-energy">0/0</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="stat-level">0</span></div>
      <div class="stat"><span class="label">Shields</span><span class="value" id="stat-shields">0/3</span></div>
    </section>

    <div id="reel">Pull the lever!</div>

    <button id="btn-spin">🎰 SPIN (1 ⚡)</button>
    <button id="btn-upgrade">⬆ Upgrade</button>
    <div class="row">
      <button id="btn-buy-energy">💎 +50 Energy (10)</button>
      <button id="btn-watch-ad">📺 Ad: +10 Energy</button>
    </div>

    <ul id="log" aria-label="Event log"></ul>
  </main>

  <div id="energy-popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-card">
      <h2 id="popup-title">Out of Energy!</h2>
      <p>Energy refills 1 every 5 minutes — or top up now:</p>
      <button id="btn-popup-buy">💎 Buy 50 Energy (10 gems)</button>
      <button id="btn-popup-ad">📺 Watch Ad (+10 energy)</button>
      <button id="btn-popup-close">Wait it out</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
